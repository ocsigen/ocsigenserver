# Build the Ocsigen Server documentation with odoc, theme it with the Ocsigen
# chrome (wodoc), and publish it on the project's gh-pages branch, served at
# https://ocsigen.org/ocsigenserver/. See doc/README.md.
#
# CI deploys ONLY the "dev" docs and ONLY from master. Stable versions are built
# by hand and committed to gh-pages at release time, so there is no dispatch /
# release path here.
name: Documentation

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      version:
        description: "Publish a stable version: freeze the dev docs now on gh-pages as /<version>/ and repoint `latest` (e.g. 1.2.3). Leave empty to just rebuild dev."
        required: false
        default: ""

jobs:
  build-deploy:
    # Manual runs too deploy only from master: a run started from another
    # branch would otherwise publish that branch as the dev docs.
    if: github.repository == 'ocsigen/ocsigenserver' && github.ref == 'refs/heads/master' && (github.event_name != 'workflow_dispatch' || github.event.inputs.version == '')
    # A newer pending dev build may replace an older pending one.
    concurrency:
      group: doc-dev
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.4.0"

      # The bottleneck of this job (~4.5 min) is compiling the dependency tree
      # plus wodoc and odoc from source; setup-ocaml only caches the base switch
      # (the compiler), so they recompiled on every push. Cache the whole _opam
      # switch keyed on the *.opam files (the dep set) and wodoc's HEAD commit; on
      # a cache hit the install is skipped entirely and only ocsigenserver itself
      # is (re)built by `dune build @doc` in the next step. The key changes — and
      # the deps/wodoc rebuild once — only when an *.opam file or wodoc move.
      - name: Resolve wodoc HEAD commit
        id: wodoc
        run: echo "sha=$(git ls-remote https://github.com/ocsigen/wodoc.git HEAD | cut -f1)" >> "$GITHUB_OUTPUT"

      - name: Cache the opam switch (deps + wodoc)
        id: switch-cache
        uses: actions/cache@v6
        with:
          path: _opam
          key: opam-switch-${{ runner.os }}-ocaml5.4.0-${{ hashFiles('*.opam') }}-wodoc-${{ steps.wodoc.outputs.sha }}

      - name: Install dependencies
        if: steps.switch-cache.outputs.cache-hit != 'true'
        run: |
          opam install . --deps-only --with-doc   # odoc is a with-doc dep
          opam pin add -n wodoc https://github.com/ocsigen/wodoc.git
          opam install wodoc

      - name: Build documentation (dev)
        run: >-
          opam exec -- wodoc build --config doc/wodoc
          --menu https://ocsigen.org/doc/menu.html
          --out "$PWD/_doc-site/dev" --label dev
          --strict-refs

      - name: Deploy to gh-pages (replace only dev/, keep the rest)
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: _doc-site/dev
          target-folder: dev
          clean: true

  release:
    # Manual run with a version: freeze the dev docs currently on gh-pages as the
    # stable /<version>/ and repoint `latest` at it (refreshing versions.json).
    # No rebuild -- the docs of a release are exactly the dev docs at that point.
    if: github.repository == 'ocsigen/ocsigenserver' && github.ref == 'refs/heads/master' && github.event_name == 'workflow_dispatch' && github.event.inputs.version != ''
    # Its own group, so that a push to master cannot replace a pending release.
    concurrency:
      group: doc-release
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # The version reaches the shell only through this variable, never
      # expanded into the scripts, so that it cannot inject commands.
      VERSION: ${{ github.event.inputs.version }}
    steps:
      - name: Check the version
        # wodoc release replaces site/<version>: refuse anything but a version
        # number (no "dev", "latest", "..", or slash).
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+(\.[0-9]+)*([~+-][0-9A-Za-z.]+)?$ ]]; then
            echo "::error::Not a version number: $VERSION"
            exit 1
          fi

      - name: Set up OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.4.0"

      - name: Install wodoc
        run: |
          opam pin add -n wodoc https://github.com/ocsigen/wodoc.git
          opam install wodoc

      - name: Checkout gh-pages
        uses: actions/checkout@v7
        with:
          ref: gh-pages
          path: site
          fetch-depth: 0

      - name: Freeze dev as the stable version and repoint latest
        # wodoc release: cp -a site/dev site/<version>, ln -sfn <version> latest,
        # write the root index.html redirect if missing, refresh versions.json.
        run: >-
          opam exec -- wodoc release --site site --from dev
          --version "$VERSION"

      - name: Commit and push gh-pages
        # A dev deploy may have pushed meanwhile (it only touches dev/): rebase
        # on it rather than fail.
        run: |
          cd site
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet \
            || git commit -m "Release doc $VERSION (freeze dev, repoint latest)"
          git pull --rebase origin gh-pages
          git push
